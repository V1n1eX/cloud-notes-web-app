<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --error: #ef4444;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .login-container {
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
    }

    h2 {
      text-align: center;
      margin-bottom: 1.5rem;
      color: var(--accent);
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
    }

    input[type="text"],
    input[type="password"] {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
      outline: none;
      border-color: var(--accent);
    }

    button[type="submit"] {
      width: 100%;
      background: var(--accent);
      color: var(--bg-primary);
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.2s;
      margin-top: 1rem;
    }

    button[type="submit"]:hover {
      background: var(--accent-hover);
    }

    .links {
      text-align: center;
      margin-top: 1.5rem;
    }

    .links a {
      color: var(--accent);
      text-decoration: none;
      font-size: 0.9rem;
    }

    .links a:hover {
      text-decoration: underline;
    }

    .error-message {
      background: var(--error);
      color: white;
      padding: 0.75rem;
      border-radius: 0.5rem;
      margin-bottom: 1rem;
      text-align: center;
      display: none;
    }

    @media (max-width: 480px) {
      .login-container {
        margin: 1rem;
        padding: 1.5rem;
      }
    }
  </style>
</head>
<body>

  <div class="login-container">
    <h2>Welcome to Cloud notes App.Login to access your notes!</h2>

    {% if messages %}
      {% for message in messages %}
        {% if 'error' in message.tags %}
          <div class="error-message" style="display: block;">
            {{ message }}
          </div>
        {% endif %}
      {% endfor %}
    {% endif %}

    <!-- Show/Hide password control (targets #password input below) -->
    <div style="margin-bottom:1rem; text-align:right;">
      <label style="font-size:0.9rem; color:var(--text-secondary); cursor:pointer;">
        <input type="checkbox" id="togglePassword" style="margin-right:0.5rem; vertical-align:middle;">
        Show password
      </label>
    </div>

    <script>
      document.addEventListener('DOMContentLoaded', function() {
        const toggle = document.getElementById('togglePassword');
        const pwd = document.getElementById('password');
        if (!toggle || !pwd) return;
        toggle.addEventListener('change', function() {
          pwd.type = this.checked ? 'text' : 'password';
        });
      });
    </script>

    <form method="POST" id="loginForm">
      {% csrf_token %}
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" required>
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required>
      </div>
      <button type="submit">Login</button>
    </form>

    <div class="links">
      <a href="{% url 'register' %}">Create account</a>
    </div>
  </div>

  <script>
    // Show error messages with animation
    document.addEventListener('DOMContentLoaded', function() {
      const errorMessages = document.querySelectorAll('.error-message');
      errorMessages.forEach(function(msg) {
        if (msg.textContent.trim()) {
          msg.style.display = 'block';
          msg.style.animation = 'fadeIn 0.3s ease-in';
        }
      });
    });

    // Add fadeIn animation
    const style = document.createElement('style');
    style.textContent = `
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
    `;
    document.head.appendChild(style);
  </script>

</body>
</html>
