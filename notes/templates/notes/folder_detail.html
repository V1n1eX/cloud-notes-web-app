<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ folder.name }} - Notes</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: #f9fafc;
      color: #222;
      margin: 0;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      margin-top: 1rem;
    }

    .section {
      margin-top: 2rem;
    }

    .note-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      background: white;
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    .btn {
      display: inline-block;
      background: #007bff;
      color: white;
      padding: 0.6rem 1rem;
      border-radius: 0.6rem;
      text-decoration: none;
      font-size: 0.9rem;
    }

    .btn-small {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
    }

    .btn-secondary {
      background: #6c757d;
    }

    .btn-danger {
      background: #dc3545;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    @media (min-width: 600px) {
      body {
        padding: 0 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>{{ folder.name }}</h1>
    <div class="actions">
      <a href="{% url 'create_note_in_folder' folder.id %}" class="btn">+ Note in Folder</a>
      <a href="{% url 'notes_home' %}" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>

  <div class="section">
    <h2>Notes in {{ folder.name }}</h2>
    <div style="margin-bottom: 1rem;">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select" onchange="window.location.href='?sort=' + this.value">
        <option value="time" {% if current_sort == 'time' %}selected{% endif %}>Time</option>
        <option value="name" {% if current_sort == 'name' %}selected{% endif %}>Name</option>
      </select>
    </div>
    {% if notes %}
      <div class="note-list">
        {% for note in notes %}
          <div class="note-card">
            <h3>{{ note.title }}</h3>
            <p>{{ note.content|truncatewords:20 }}</p>
            <div class="actions">
              <a href="{% url 'view_note' note.id %}" class="btn-small">View</a>
              <a href="{% url 'edit_note' note.id %}" class="btn-small">Edit</a>
              <a href="{% url 'move_note' note.id %}" class="btn-small btn-secondary">Move</a>
              <a href="{% url 'delete_note' note.id %}" class="btn-small btn-danger">Delete</a>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p>No notes in this folder yet.</p>
    {% endif %}
  </div>

</body>
</html>
