<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ folder.name }} - Notes</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      margin-top: 1rem;
      color: var(--accent);
    }

    h2 {
      color: var(--accent);
      margin-bottom: 1rem;
    }

    .section {
      margin-top: 2rem;
    }

    .note-list {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .note-card {
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 1rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--bg-primary);
      padding: 0.6rem 1rem;
      border-radius: 0.6rem;
      text-decoration: none;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
      font-weight: 600;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-small {
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      background: #64748b;
      color: var(--text-primary);
    }

    .btn-small:hover {
      background: #475569;
    }

    .btn-secondary {
      background: #64748b;
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-danger {
      background: var(--danger);
      color: white;
    }

    .btn-danger:hover {
      background: var(--danger-hover);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 1rem;
    }

    .actions {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
    }

    .sort-container {
      margin-bottom: 1rem;
    }

    label {
      color: var(--text-primary);
      font-weight: 500;
      margin-right: 0.5rem;
    }

    select {
      padding: 0.5rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 0.9rem;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    @media (min-width: 600px) {
      body {
        padding: 0 2rem;
      }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <h1>{{ folder.name }}</h1>
    <div class="actions">
      <a href="{% url 'create_note_in_folder' folder.id %}" class="btn">+ Note in Folder</a>
      <a href="{% url 'notes_home' %}" class="btn btn-secondary">Back to Home</a>
    </div>
  </div>

  <div class="section">
    <h2>Notes in {{ folder.name }}</h2>
    <div style="margin-bottom: 1rem;">
      <label for="sort-select">Sort by:</label>
      <select id="sort-select" onchange="window.location.href='?sort=' + this.value">
        <option value="time" {% if current_sort == 'time' %}selected{% endif %}>Time</option>
        <option value="name" {% if current_sort == 'name' %}selected{% endif %}>Name</option>
      </select>
    </div>
    {% if notes %}
      <div class="note-list">
        {% for note in notes %}
          <div class="note-card">
            <h3>{{ note.title }}</h3>
            <p>{{ note.content|truncatewords:20 }}</p>
            <div class="actions">
              <a href="{% url 'view_note' note.id %}" class="btn-small">View</a>
              <a href="{% url 'edit_note' note.id %}" class="btn-small">Edit</a>
              <a href="{% url 'move_note' note.id %}" class="btn-small btn-secondary">Move</a>
              <a href="{% url 'delete_note' note.id %}" class="btn-small btn-danger">Delete</a>
            </div>
          </div>
        {% endfor %}
      </div>
    {% else %}
      <p>No notes in this folder yet.</p>
    {% endif %}
  </div>

</body>
</html>
