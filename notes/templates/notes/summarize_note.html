{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Summary of {{ note.title }}</title>

  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
      --danger: #ef4444;
      --danger-hover: #dc2626;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      margin-top: 1rem;
      color: var(--accent);
    }

    .summary-container {
      max-width: 800px;
      margin: 2rem auto;
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .note-title {
      font-size: 2rem;
      margin-bottom: 1rem;
      border-bottom: 2px solid var(--accent);
      padding-bottom: 0.5rem;
      color: var(--accent);
    }

    .summary-content {
      line-height: 1.6;
      white-space: pre-wrap;
      margin-bottom: 2rem;
      color: var(--text-primary);
    }

    /* Form Styling */
    .form-container {
      margin-top: 2rem;
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 600;
      color: var(--text-primary);
    }

    input[type="text"],
    textarea,
    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 1rem;
    }

    textarea {
      min-height: 150px;
      resize: vertical;
    }

    .actions {
      text-align: center;
      margin-top: 2rem;
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--bg-primary);
      padding: 0.75rem 1.5rem;
      border-radius: 0.5rem;
      text-decoration: none;
      font-size: 1rem;
      margin: 0 0.5rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
      font-weight: 600;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #64748b;
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #475569;
    }
  </style>
</head>
<body>

  <h1>Summary of {{ note.title }}</h1>

  <div class="summary-container">
    <div class="summary-content">
      {{ summary }}
    </div>
  </div>

 <div class="actions">
    <a href="{% url 'save_summary' note.id %}" class="btn">Save Note</a>
    <a href="{% url 'view_note' note.id %}" class="btn">Back to Note</a>
    <a href="{% url 'notes_home' %}" class="btn btn-secondary">Back to Home</a>
</div>

</body>
</html>
