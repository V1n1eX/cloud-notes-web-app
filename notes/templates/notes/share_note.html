<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Share Note</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap');

    /* --- Root & Reset --- */
    :root {
      --bg-dark: #0f172a;      /* Slate 900 */
      --bg-medium: #1e293b;   /* Slate 800 */
      --border-light: #334155; /* Slate 700 */
      --text-light: #e2e8f0;    /* Slate 200 */
      --text-medium: #94a3b8;   /* Slate 400 */
      --brand-blue: #38bdf8;   /* Sky 400 */
      --brand-blue-hover: #7dd3fc; /* Sky 300 */
      --danger-red: #f43f5e;    /* Rose 500 */
      --danger-red-hover: #fb7185; /* Rose 400 */
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-dark);
      color: var(--text-light);
    }

    /* Utility Container */
    .container {
      max-width: 1400px;
      margin: 0 auto;
      padding: 0 1rem; /* Mobile padding */
    }

    /* --- Typography --- */
    h1, h2, h3 {
      font-weight: 600;
      line-height: 1.3;
    }

    h1 {
      color: var(--brand-blue);
      font-size: 1.75rem;
      text-align: center;
      margin-top: 1rem;
    }

    h3 {
      color: var(--brand-blue);
      font-size: 1.25rem;
    }

    p {
      color: var(--text-medium);
      font-size: 0.9rem;
      line-height: 1.6;
    }

    a {
      text-decoration: none;
      color: var(--brand-blue);
    }

    /* --- Form Container --- */
    .form-container {
      max-width: 600px;
      margin: 2rem auto;
      background: var(--bg-medium);
      border-radius: 16px;
      padding: 2rem;
      border: 1px solid var(--border-light);
      box-shadow: 0 4px 10px rgba(0,0,0,0.25);
    }

    .form-group {
      margin-bottom: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: var(--text-light);
    }

    input[type="text"], select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--border-light);
      border-radius: 8px;
      font-size: 1rem;
      background: var(--bg-dark);
      color: var(--text-light);
      font-family: 'Poppins', sans-serif;
    }

    input[type="text"]:focus, select:focus {
      outline: none;
      border-color: var(--brand-blue);
      box-shadow: 0 0 0 2px rgba(56,189,248,0.2);
    }

    .error {
      color: var(--danger-red);
      font-size: 0.85rem;
      margin-top: 0.25rem;
    }

    /* --- Buttons --- */
    .btn {
      display: inline-block;
      padding: 0.75rem 1.5rem;
      border: none;
      border-radius: 8px;
      text-decoration: none;
      font-size: 1rem;
      font-weight: 600;
      transition: all 0.2s ease;
      cursor: pointer;
      margin-right: 0.5rem;
    }
    .btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.2);
    }

    /* Primary */
    .btn-primary {
      background: var(--brand-blue);
      color: var(--bg-dark);
    }
    .btn-primary:hover {
      background: var(--brand-blue-hover);
    }

    /* Secondary */
    .btn-secondary {
      background: var(--border-light);
      color: var(--text-light);
    }
    .btn-secondary:hover {
      background: #475569; /* Slate 600 */
    }

    /* --- Responsive Breakpoints --- */

    /* Tablet */
    @media (min-width: 640px) {
      .container {
        padding: 0 1.5rem;
      }
    }

    /* Large Desktop */
    @media (min-width: 1024px) {
       .container {
        padding: 0 2rem;
      }
    }
  </style>
</head>
<body>

  <h1>Share Note: {{ note.title }}</h1>

  <div class="form-container">
    <form method="post">
      {% csrf_token %}
      <div class="form-group">
        <label for="{{ form.username.id_for_label }}">{{ form.username.label }}</label>
        {{ form.username }}
        {% if form.username.errors %}
          <div class="error">{{ form.username.errors }}</div>
        {% endif %}
      </div>
      
      <div class="form-group">
        <label for="{{ form.permission.id_for_label }}">{{ form.permission.label }}</label>
        {{ form.permission }}
      </div>
      {% if form.non_field_errors %}
        <div class="error">{{ form.non_field_errors }}</div>
      {% endif %}
      <button type="submit" class="btn">Share</button>
      <a href="{% url 'view_note' note.id %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div>

</body>
</html>
