<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Move Note</title>
  <style>
    :root {
      --bg-primary: #0f172a;
      --bg-secondary: #1e293b;
      --text-primary: #e2e8f0;
      --text-secondary: #94a3b8;
      --accent: #38bdf8;
      --accent-hover: #0ea5e9;
      --border: #334155;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      margin: 0;
      padding: 0 1rem;
    }

    h1 {
      text-align: center;
      margin-top: 1rem;
      color: var(--accent);
    }

    .section {
      margin-top: 2rem;
    }

    .form-container {
      max-width: 400px;
      margin: 2rem auto;
      background: var(--bg-secondary);
      border-radius: 1rem;
      padding: 2rem;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
    }

    .btn {
      display: inline-block;
      background: var(--accent);
      color: var(--bg-primary);
      padding: 0.6rem 1rem;
      border-radius: 0.6rem;
      text-decoration: none;
      font-size: 0.9rem;
      border: none;
      cursor: pointer;
      transition: background-color 0.2s;
      font-weight: 600;
    }

    .btn:hover {
      background: var(--accent-hover);
    }

    .btn-secondary {
      background: #64748b;
      color: var(--text-primary);
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: bold;
      color: var(--text-primary);
    }

    select {
      width: 100%;
      padding: 0.5rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
      background: var(--bg-primary);
      color: var(--text-primary);
      font-size: 1rem;
      transition: border-color 0.2s;
    }

    select:focus {
      outline: none;
      border-color: var(--accent);
    }

    .actions {
      text-align: center;
      margin-top: 1rem;
    }

    @media (min-width: 600px) {
      body {
        padding: 0 2rem;
      }
    }
  </style>
</head>
<body>

  <h1>Move Note: {{ note.title }}</h1>

  <div class="section">
    <form method="POST">
      {% csrf_token %}
      <div class="form-group">
        <label for="folder">Select Folder:</label>
        <select name="folder" id="folder">
          <option value="">Move to Loose Notes (no folder)</option>
          {% for folder in folders %}
            <option value="{{ folder.id }}">{{ folder.name }}</option>
          {% endfor %}
        </select>
      </div>
      <button type="submit" class="btn">Move Note</button>
    </form>
    <br>
    <a href="{% url 'notes_home' %}" class="btn btn-secondary">Cancel</a>
  </div>

</body>
</html>
