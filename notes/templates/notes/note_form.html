<h2>{{ action }} Note{% if folder %} in "{{ folder.name }}"{% endif %}</h2>

<form method="POST">
  {% csrf_token %}
  {{ form.as_p }}
  <button type="submit">{{ action }}</button>
</form>

{% if folder %}
  <a href="{% url 'folder_detail' folder.id %}">Back to {{ folder.name }}</a>
{% else %}
  <a href="{% url 'notes_home' %}">Back to Dashboard</a>
{% endif %}
